<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitud de turno | Centro Médico</title>
  <!-- Bootstrap 5.3 (solo CSS: no hace falta JavaScript) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Paleta del proyecto */
    :root { --tinta: #12302f; --verde: #1b6b5f; --papel: #f4f7f4; }
    body { background: var(--papel); color: var(--tinta); }
    .panel-info { background: var(--verde); color: #fff; border-radius: .75rem; }
    .btn-verde { background: var(--verde); color: #fff; }
    .btn-verde:hover { background: #14524a; color: #fff; }
  </style>
</head>
<body>
  <main class="container py-4 py-lg-5">
    <div class="row g-4">

      <!-- Columna informativa -->
      <aside class="col-lg-4">
        <div class="panel-info p-4 h-100">
          <h1 class="h3">Pedí tu turno</h1>
          <p>Completá el formulario y te confirmamos por email dentro de las 48 hs hábiles.</p>
          <h2 class="h6 mt-4">Atención</h2>
          <p class="mb-2">Lunes a sábado, de 8 a 18 hs.</p>
          <h2 class="h6 mt-4">Llevá el día del turno</h2>
          <ul class="ps-3 mb-0">
            <li>DNI</li>
            <li>Credencial de la obra social</li>
            <li>Estudios previos, si tenés</li>
          </ul>
        </div>
      </aside>

      <!-- Formulario -->
      <section class="col-lg-8">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4">
            <!-- La validación la hace el navegador con los atributos HTML5 (required, pattern, type, etc.).
                 Si algo está mal, el navegador no envía el formulario y marca el campo a corregir.
                 method="get" y action="#": el envío es de prueba, sin servidor. -->
            <form class="row g-3" action="#" method="get">

              <div class="col-md-6">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required minlength="2" maxlength="40" autocomplete="given-name">
              </div>

              <div class="col-md-6">
                <label for="apellido" class="form-label">Apellido</label>
                <input type="text" class="form-control" id="apellido" name="apellido" required minlength="2" maxlength="40" autocomplete="family-name">
              </div>

              <div class="col-md-6">
                <label for="dni" class="form-label">DNI</label>
                <!-- pattern: solo 7 u 8 números. El texto de title aparece en el aviso de error -->
                <input type="text" class="form-control" id="dni" name="dni" required pattern="[0-9]{7,8}" inputmode="numeric"
                       placeholder="Sin puntos" title="El DNI debe tener 7 u 8 números, sin puntos.">
              </div>

              <div class="col-md-6">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="tel" class="form-control" id="telefono" name="telefono" required pattern="[0-9 +()\-]{8,18}"
                       placeholder="Ej: 261 555 1234" title="Solo números, espacios y los símbolos + - ( )." autocomplete="tel">
              </div>

              <div class="col-12">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
              </div>

              <div class="col-md-6">
                <label for="especialidad" class="form-label">Especialidad</label>
                <select class="form-select" id="especialidad" name="especialidad" required>
                  <option value="" selected disabled>Elegí una opción</option>
                  <option>Clínica médica</option>
                  <option>Pediatría</option>
                  <option>Cardiología</option>
                  <option>Dermatología</option>
                  <option>Traumatología</option>
                </select>
              </div>

              <div class="col-md-6">
                <label for="obraSocial" class="form-label">Obra social</label>
                <select class="form-select" id="obraSocial" name="obraSocial" required>
                  <option value="" selected disabled>Elegí una opción</option>
                  <option>OSEP</option>
                  <option>PAMI</option>
                  <option>Prepaga</option>
                  <option>Sin obra social</option>
                </select>
              </div>

              <div class="col-md-6">
                <label for="fecha" class="form-label">Fecha preferida</label>
                <input type="date" class="form-control" id="fecha" name="fecha" required>
              </div>

              <div class="col-md-6">
                <span class="form-label d-block">Franja horaria</span>
                <div class="form-check form-check-inline mt-2">
                  <input class="form-check-input" type="radio" name="franja" id="manana" value="Mañana" required>
                  <label class="form-check-label" for="manana">Mañana</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="franja" id="tarde" value="Tarde" required>
                  <label class="form-check-label" for="tarde">Tarde</label>
                </div>
              </div>

              <div class="col-12">
                <label for="motivo" class="form-label">Motivo de la consulta <span class="text-secondary">(opcional)</span></label>
                <textarea class="form-control" id="motivo" name="motivo" rows="3" maxlength="300"></textarea>
              </div>

              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="acepto" name="acepto" required>
                  <label class="form-check-label" for="acepto">Acepto que usen mis datos para gestionar el turno.</label>
                </div>
              </div>

              <div class="col-12">
                <button type="submit" class="btn btn-verde btn-lg">Solicitar turno</button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
